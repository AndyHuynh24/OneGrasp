# c4_mnv3L_gru_proj_lm2 retrained with the touch-table gestures added (draw_word, pinch-zoom, type_ipad;
# overhead only). Same hyperparameters; only the data changes.
name: c4_mnv3L_gru_proj_lm2_tt
backbone: mobilenetv3_large_100.ra_in1k
temporal: gru
T: 8
input_repr: rgb
epochs: 8
samples_per_epoch: 60000
batch_size: 32
lr: 5.0e-4
proj_aug: 0.5
lm_feats: v2
lm_emb: 64
img_drop: 0.2
max_minutes: 600  # 8 epochs at ~1 it/s need ~5 h awake; 240 would cut the cosine schedule
