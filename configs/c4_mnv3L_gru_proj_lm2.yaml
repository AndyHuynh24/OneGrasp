# c4_mnv3L_gru_proj + v2 landmark kinematics (tip/wrist motion, accel, flexion), wider landmark
# branch, image-branch dropout so the GRU must use the landmarks
name: c4_mnv3L_gru_proj_lm2
backbone: mobilenetv3_large_100.ra_in1k
temporal: gru
T: 8
input_repr: rgb
epochs: 8
samples_per_epoch: 60000
batch_size: 32
lr: 5.0e-4
proj_aug: 0.5
lm_feats: v2
lm_emb: 64
img_drop: 0.2
