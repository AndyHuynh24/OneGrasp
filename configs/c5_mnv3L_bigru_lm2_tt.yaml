# OFFLINE (non-causal) model for recorded video only: c4_mnv3L_gru_proj_lm2_tt with a bidirectional
# GRU. T 12: each frame is scored with 6 past + 5 future frames (~170 ms look-ahead). Not for live.
name: c5_mnv3L_bigru_lm2_tt
backbone: mobilenetv3_large_100.ra_in1k
temporal: bigru
T: 12
input_repr: rgb
epochs: 8
samples_per_epoch: 60000
batch_size: 32
lr: 5.0e-4
proj_aug: 0.5
lm_feats: v2
lm_emb: 64
img_drop: 0.2
max_minutes: 600  # 8 epochs at ~1 it/s need ~5 h awake; 240 would cut the cosine schedule
